name: Build Royal Match Overlay APK
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: royal-match-overlay-v8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoyalMatchOverlayV8
          path: royal-match-overlay-v8/app/build/outputs/apk/debug/app-debug.apk
