name: Build MT5 Phone Desktop APK

on:
  push:
    branches:
      - mt5-phone-desktop
    paths:
      - 'mt5-phone-desktop/**'
      - '.github/workflows/build-mt5-phone-desktop.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mt5-phone-desktop/**'
      - '.github/workflows/build-mt5-phone-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p mt5-phone-desktop assembleDebug
      - name: Rename APK
        run: cp mt5-phone-desktop/app/build/outputs/apk/debug/app-debug.apk MT5-Phone-Desktop.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT5-Phone-Desktop-APK
          path: MT5-Phone-Desktop.apk
