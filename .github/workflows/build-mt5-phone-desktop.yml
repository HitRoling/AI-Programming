name: Build MT5 Phone Desktop APK

on:
  push:
    branches: [mt5-phone-desktop]
    paths:
      - 'mt5-phone-desktop/**'
      - '.github/workflows/build-mt5-phone-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p mt5-phone-desktop assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT5-Phone-Desktop-APK
          path: mt5-phone-desktop/app/build/outputs/apk/debug/app-debug.apk
