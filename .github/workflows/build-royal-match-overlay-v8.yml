name: Build Royal Match Overlay V8

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: royal-match-overlay-v8
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK
        run: cp royal-match-overlay-v8/app/build/outputs/apk/debug/app-debug.apk royal-match-overlay-v8/app/build/outputs/apk/debug/RoyalMatchOverlayV8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoyalMatchOverlayV8
          path: royal-match-overlay-v8/app/build/outputs/apk/debug/RoyalMatchOverlayV8.apk
          if-no-files-found: error
