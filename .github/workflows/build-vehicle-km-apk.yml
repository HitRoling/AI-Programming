name: Build Vehicle KM APK

on:
  push:
    branches: [vehicle-km-apk-20260806]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: vehicle-km-log
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK
        run: cp vehicle-km-log/app/build/outputs/apk/debug/app-debug.apk vehicle-km-log/app/build/outputs/apk/debug/Vehicle-KM-Log.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vehicle-KM-Log-APK
          path: vehicle-km-log/app/build/outputs/apk/debug/Vehicle-KM-Log.apk
          if-no-files-found: error
